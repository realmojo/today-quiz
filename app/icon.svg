<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="투데이퀴즈">
  <!--
    헤더 로고와 같은 형태 — 브랜드 블루 라운드 사각형 위에 흰 Q.
    색은 globals.css의 oklch 토큰을 sRGB로 변환한 값이다.
      #2875E8 = oklch(0.58 0.19 259) : primary
      #00926B = oklch(0.58 0.13 168) : correct (정답 민트, Q의 꼬리)
    16px로 줄어들어도 형태가 뭉개지지 않도록 획을 굵게 잡았다.
    XML 주석에는 이중 하이픈을 쓸 수 없다(래스터라이저가 파싱에서 죽는다).
  -->
  <rect width="64" height="64" rx="15" fill="#2875E8"/>
  <circle cx="32" cy="30" r="13.5" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M38 38 L47 48" stroke="#00926B" stroke-width="7" stroke-linecap="round"/>
</svg>
